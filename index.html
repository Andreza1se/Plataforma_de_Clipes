<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111411">
  <title>FanClips — comunidades em clipes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#feed" aria-label="FanClips, início"><span class="brand-mark">F</span><span>FanClips</span></a>
    <nav class="main-nav" aria-label="Navegação principal">
      <button class="nav-link active" data-view="feed">Para você</button>
      <button class="nav-link" data-view="communities">Comunidades</button>
      <button class="nav-link" data-view="watched">Assistidos</button>
    </nav>
    <label class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="Buscar clipes ou criadores" aria-label="Buscar clipes ou criadores"><kbd>/</kbd></label>
    <div class="top-actions"><button class="button button-primary" data-action="upload"><span aria-hidden="true">＋</span> Criar Clip</button><button class="avatar-button" id="account-button" aria-label="Abrir perfil">CA</button></div>
  </header>

  <main id="app" class="app-shell" tabindex="-1"></main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <dialog id="auth-dialog" class="dialog"></dialog>
  <dialog id="upload-dialog" class="dialog"></dialog>
  <dialog id="detail-dialog" class="dialog dialog-wide"></dialog>
  <script src="app.js" defer></script>
</body>
</html>
